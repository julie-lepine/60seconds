<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>60 SECONDS</title>
<link rel="stylesheet" href="./src/styles/app.css">
</head>
<body>
<div id="stage">
  <div id="app">
    <aside class="ad-banner" aria-label="Publicité">
      <div class="ad-slot">
        <div class="ad-placeholder">Publicité</div>
      </div>
    </aside>
    <div id="view"></div>
  </div>
</div>
<script>
(function(){
  var KEY = '60seconds_lang';
  var SUPPORTED = ['fr', 'en', 'es', 'de'];
  var TAGS = { en: 'en-US', es: 'es-ES', de: 'de-DE', fr: 'fr-FR' };
  function normalize(raw){
    var code = String(raw || '').slice(0, 2).toLowerCase();
    return SUPPORTED.indexOf(code) >= 0 ? code : '';
  }
  function spoof(code){
    var tag = TAGS[code] || code;
    try{
      Object.defineProperty(navigator, 'language', { configurable: true, get: function(){ return tag; } });
      Object.defineProperty(navigator, 'languages', { configurable: true, get: function(){ return [tag, code]; } });
      Object.defineProperty(navigator, 'userLanguage', { configurable: true, get: function(){ return tag; } });
    }catch(e){}
  }
  window.setLang = function setLang(code){
    var next = normalize(code);
    if(!next){
      console.warn('Langues supportées : fr, en, es, de');
      return;
    }
    localStorage.setItem(KEY, next);
    location.reload();
  };
  window.clearLang = function clearLang(){
    localStorage.removeItem(KEY);
    location.reload();
  };
  var override = normalize(localStorage.getItem(KEY));
  if(override) spoof(override);
})();
</script>
<script type="module" src="./src/main.js"></script>
